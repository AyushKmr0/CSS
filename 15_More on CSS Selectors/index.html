        .boxes::before {

            content: "Hello World!";
            color: red;

        ::selection {
            background-color: rgb(238, 45, 45);
            color: black;
        }

        .box::first-letter {
            color: peru;
            font-size: 34px;
        }

        input::placeholder {
            color: rgb(180, 174, 174);

<body>
