<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object fit and position</title>
    <style>
        .container {
            width: 466px;
            height: 488px;
            border: 2px solid black;
            /* background-color: azure; */

            background-clip: border-box;
            background-image: url("https://img.freepik.com/free-photo/creative-light-bulb-abstract-glowing-blue-background-generative-ai_188544-8090.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

        }
        img {
            width: 466px;
            height: 488px;
            object-fit: cover;
            /* object-fit: scale-down; */
            /* object-fit: contain; */

            /* object-position: top left; */
            object-position: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <img src="https://img.freepik.com/free-photo/creative-light-bulb-abstract-glowing-blue-background-generative-ai_188544-8090.jpg" alt=""> -->
    </div>
</body>
</html>
