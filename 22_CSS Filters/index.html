<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        img {
            filter: blur(5px);
            filter: brightness(3);
            filter: contrast(5) brightness(3);
            filter: drop-shadow(50px 40px 96px red) invert(90%) ;
            filter: grayscale(80%);
            filter: hue-rotate(80deg);
            filter: invert(90%);
            filter: opacity(30%);
            filter: saturate(30%);
            filter: sepia(60%);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://img.freepik.com/free-photo/creative-light-bulb-abstract-glowing-blue-background-generative-ai_188544-8090.jpg"
            alt="">
    </div>
</body>

</html>
