<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container {
            width: 80vw;
            height: 190px;
            background-color: rgba(47, 217, 255, 0.89);
            border: 2px solid black;
        }

        .box {
            /* width: 34px; */
            border-radius: 50%;
            height: 190px;
            background-color: rgb(255, 95, 36);
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

            /* animation: aapnaAnimation;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.88, 0.03, 0.01, 0.99);
            animation-delay: 1s;
            animation-direction: alternate;
            animation-play-state: paused ; */

            animation: aapnaAnimation 3s ease-in-out 0s infinite alternate,
                       ani2 3s ease-in-out infinite;
        }

        @keyframes aapnaAnimation {
            from {}

            to {
                transform: translateX(70vw);
            }
        }
        
        @keyframes ani2 {
            0% {
                transform: rotate(90deg);
                background-color: yellow;
            }
            
            30% {
                transform: rotate(180deg);
            }
            
            60% {
                transform: rotate(180deg);
                background-color: red;
            }
            
            100% {
                transform: rotate(360deg);
                background-color: rgb(13, 0, 255);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>

</html>
